{% extends "base.html" %}

{% block title %}{{ _('404 - Página no encontrada') }}{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 60px 24px;">
    <div class="panel" style="max-width: 480px; margin: 0 auto;">
        <h1 style="font-size: 72px; margin: 0; color: var(--azul);">404</h1>
        <h2>{{ _('Página no encontrada') }}</h2>
        <p>{{ _('Lo sentimos, la página que buscas no existe.') }}</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">{{ _('Volver al inicio') }}</a>
    </div>
</div>
{% endblock %}
