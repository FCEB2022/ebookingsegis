services:
  - type: web
    name: equahome
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: equahome-db
          property: connectionString
    autoDeploy: true

databases:
  - name: equahome-db
    databaseName: equahome
    user: equahome
